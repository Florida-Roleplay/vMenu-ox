name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - production

concurrency:
  group: vmenu-ox-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore vMenu.sln

      - name: Build solution
        run: msbuild vMenu.sln /p:Configuration=Release /verbosity:minimal

      - name: Verify build output
        shell: pwsh
        run: |
          foreach ($dll in 'vMenuClient.net.dll', 'vMenuServer.net.dll', 'MenuAPI.dll') {
            if (-not (Test-Path "build/vMenu/$dll")) { throw "Missing build output: $dll" }
          }
